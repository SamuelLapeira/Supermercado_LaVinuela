# Perfil de producción. Los secretos llegan por variables de entorno o por un gestor de secretos;
# nunca se escriben en este fichero. Conexión siempre con TLS.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  flyway:
    url: ${DB_URL}
    user: ${DB_MIGRATE_USER}
    password: ${DB_MIGRATE_PASSWORD}

management:
  server:
    # Puerto aparte para sondas y métricas. NO debe publicarse a internet: solo la red interna
    # (orquestador, sistema de métricas). La dirección se fija según el alojamiento.
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}

logging:
  structured:
    format:
      # Una línea JSON por registro (formato ECS), lista para cualquier sistema de registros.
      console: ecs
    ecs:
      service:
        name: lavinuela-shop
        environment: production
  level:
    root: INFO
