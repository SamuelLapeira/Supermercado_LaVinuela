# Configuración común. Los valores de negocio (tarifas, plazos, pedido mínimo...) NO van aquí:
# viven en la base de datos y los edita la empresa desde el panel (ver Fase 5, app_settings).
spring:
  application:
    name: lavinuela-shop
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    hikari:
      maximum-pool-size: 10
      # Aislamiento READ COMMITTED: menos bloqueos de hueco y menos interbloqueos en el stock (Fase 5, apartado 1).
      transaction-isolation: TRANSACTION_READ_COMMITTED

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway. Si las entidades no coinciden con las tablas, la aplicación no arranca.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful
  error:
    # Nunca se devuelven mensajes técnicos ni trazas de pila al cliente.
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# Observabilidad (docs/observability.md). Aquí solo lo común; el puerto interno y el formato de los
# registros dependen del perfil.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Sin detalles: la respuesta solo dice UP o DOWN. Nunca se revelan nombres de servicios ni de bases de datos.
      show-details: never
      group:
        # La aplicación solo está "lista" para recibir tráfico si puede hablar con la base de datos.
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Permite calcular percentiles (p95, p99) de la latencia en el sistema de métricas.
      percentiles-histogram:
        http.server.requests: true
  info:
    java:
      enabled: true

# Contrato OpenAPI (docs/api-contract.md). Solo se publica el documento JSON; no se incluye Swagger UI.
springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**
  # Salida siempre igual (claves ordenadas): el contrato guardado en Git solo cambia cuando cambia la API de verdad.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

# Ajustes propios de la aplicación. Los secretos NO van aquí: llegan por variables de entorno.
app:
  mail:
    from: ${APP_MAIL_FROM:no-reply@lavinuela.local}

logging:
  pattern:
    # Todos los registros de una petición llevan su identificador de seguimiento.
    level: "%5p [%X{requestId:-}]"
