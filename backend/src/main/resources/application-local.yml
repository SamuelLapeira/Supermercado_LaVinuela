# Perfil de desarrollo local. Requiere el entorno de Docker (./tools/dev-up.sh) y las variables de .env.
# Flyway migra con un usuario con permisos de DDL; la aplicación trabaja con otro que solo tiene DML.
spring:
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:shop}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=PREFERRED
    username: app_rw
    password: ${DB_APP_PASSWORD}
  flyway:
    url: ${spring.datasource.url}
    user: app_migrate
    password: ${DB_MIGRATE_PASSWORD}
  mail:
    # Mailpit (entorno local): recoge todos los correos sin enviarlos de verdad. Se ven en http://127.0.0.1:8025
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_SMTP_PORT:1025}

app:
  identity:
    # Clave secreta de los códigos de verificación. La genera ./tools/dev-up (APP_CODE_PEPPER en .env).
    code-pepper: ${APP_CODE_PEPPER}

management:
  server:
    # Los puntos de control van en un puerto aparte y solo accesible desde esta máquina.
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers

logging:
  level:
    com.lavinuela.shop: DEBUG
