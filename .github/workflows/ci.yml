# Integración continua: se ejecuta en cada cambio a main y en cada pull request.
# Comprueba lo mismo que se puede comprobar en local (ver docs/ci.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si llega un cambio nuevo a la misma rama, cancela la ejecución anterior que aún no ha terminado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos: solo leer el código.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 25, Maven y MySQL real)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Compila con los avisos como error, ejecuta todas las pruebas (incluidas las de MySQL con
      # Testcontainers; Docker viene instalado en el runner) y las reglas de arquitectura.
      - name: Compilar y probar
        run: mvn -B -ntp verify

      # En integración continua NO puede saltarse ninguna prueba: si Docker no estuviera disponible,
      # las pruebas de base de datos se saltarían en silencio y el resultado sería engañoso.
      - name: Comprobar que no se ha saltado ninguna prueba
        run: |
          if grep -hE 'skipped="[1-9][0-9]*"' target/surefire-reports/TEST-*.xml; then
            echo "::error::Hay pruebas saltadas. En integración continua deben ejecutarse todas (revisa que Docker esté disponible)."
            exit 1
          fi

      - name: Guardar los informes de pruebas si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-backend
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (Angular 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Angular 22 exige Node.js 22.22.3 o superior, 24.15 o superior, o 26.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci instala exactamente lo que dice package-lock.json (reproducible).
      - name: Instalar dependencias
        run: npm ci

      # La compilación de producción aplica TypeScript estricto y los límites de tamaño.
      - name: Compilar la tienda
        run: npx ng build tienda

      - name: Compilar el panel
        run: npx ng build panel

      - name: Pruebas
        run: npx ng test --watch=false
