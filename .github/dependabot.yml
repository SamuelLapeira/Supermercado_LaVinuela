# Actualizaciones automáticas de dependencias: una vez por semana, GitHub abre un pull request por cada
# grupo de cambios. La integración continua los comprueba antes de aceptarlos (regla del proyecto:
# versiones al día y sin APIs deprecadas, ver ADR-002).
# Los saltos de versión MAYOR de las piezas centrales no se proponen: se hacen a propósito y con calma.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      maven-parches-y-menores:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-parches-y-menores:
        update-types: [minor, patch]
    ignore:
      # Angular exige una versión concreta de TypeScript y de sus paquetes: se actualizan con "ng update".
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      # MySQL 8.4 LTS es una decisión de arquitectura (ADR-002): no se cambia de versión por una
      # actualización automática. Un cambio de versión de la base de datos se hace a propósito.
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]